<!DOCTYPE html>
<!--
  もこりん（統合先のコピー）。原本: third_party/mokorin_friend_source/templates/index.html
  原本からの変更:
  - CSS/JS の参照をルート絶対パス（/static/...）から同じフォルダの相対パスへ（WKWebView でローカル読み込みするため）
  - ページ見出し・説明文・操作ボタンを削除（表情・動作・セリフは SwiftUI から JavaScript 関数で制御する）
  - キャラクターを #fit で包み、表示サイズに合わせて縮小する（キャラクター本体のアニメーションと干渉させないため）
  キャラクター本体（#character 以下の要素・クラス名）は原本と同じ。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>もこりん</title>
  <link rel="stylesheet" href="mokorin.css">
</head>
<body>
  <div id="fit">
    <div id="character" class="mocorin calm">
      <div class="sprout"><span></span><span></span></div>
      <div class="body">
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="eyes"><span></span><span></span></div>
        <div class="mouth"></div>
      </div>
    </div>
    <p id="emotion" hidden>RELAX ☁️</p>
    <div id="dialogue" hidden></div>
  </div>
  <script src="mokorin.js"></script>
</body>
</html>
